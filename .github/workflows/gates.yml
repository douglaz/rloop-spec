name: gates

# A green check that asserts nothing is worse than no check, so this workflow runs gates that
# can fail, and then proves each one can, on a scratch copy of the set: the gate green there
# unmutated, then one thing broken and the gate required to exit non-zero *and* print the
# diagnostic that this mutation causes, with the mutated run's output in the log either way
# (ADR-0007: a control names concrete syntax and pairs with a positive one).
# The negative-control argument's owner is README.md, *Gates*.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: specification gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The formal layer (ADR-0002) needs Lean; flake.nix is the one place the toolchain is
      # pinned, so CI enters the same shell a developer does.
      - uses: cachix/install-nix-action@v31

      - name: Run all gates
        run: nix develop --command bash tools/check-all.sh

      # What this proves is that check-all.sh still reaches the controls, not that the controls
      # detect anything: the mutation replaces the controls file whole, so the row is red on any
      # run that executes it, and a check-all.sh that stopped passing it to the runner prints no
      # controls row at all -- the other rows PASS and exit zero -- which is why the unmutated
      # run is held to the PASS row and not to its exit status alone.
      - name: Prove the aggregate gate still reaches the controls
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; cp -r . "$tmp/repo"; cd "$tmp/repo"
          st=0; nix develop --command bash tools/check-all.sh > "$tmp/clean" 2>&1 || st=$?
          cat "$tmp/clean"
          [ "$st" = 0 ] || { echo "::error::aggregate gate red unmutated"; exit 1; }
          grep -qF 'PASS  controls' "$tmp/clean" \
            || { echo "::error::aggregate gate green unmutated, but without a controls row"; exit 1; }
          echo 'raise SystemExit(1)' > tools/test_citation_gates.py
          st=0; nix develop --command bash tools/check-all.sh > "$tmp/out" 2>&1 || st=$?
          cat "$tmp/out"
          [ "$st" != 0 ] \
            || { echo "::error::aggregate gate passed a controls file that exits 1"; exit 1; }
          grep -qF 'FAIL  controls' "$tmp/out" \
            || { echo "::error::aggregate gate red, but not on the controls row"; exit 1; }

      # check_ids.py prints advisory findings on a clean tree too, so this control anchors on the
      # DANGLING: line and not on exit status alone.
      - name: Prove the identifier gate can fail
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; cp -r . "$tmp/repo"; cd "$tmp/repo"
          python3 tools/check_ids.py || { echo "::error::identifier gate red unmutated"; exit 1; }
          printf '\n**RUN-9999** A citation to `DIR-9999`, which does not exist.\n' >> 00-overview.md
          st=0; python3 tools/check_ids.py > "$tmp/out" 2>&1 || st=$?
          cat "$tmp/out"
          [ "$st" != 0 ] || { echo "::error::identifier gate passed a dangling citation"; exit 1; }
          grep -qF "DANGLING: ['DIR-9999']" "$tmp/out" \
            || { echo "::error::identifier gate red, but not on the dangling citation"; exit 1; }

      # Both tiers of the line-citation gate in one step and one scratch copy: the two mutations
      # are the same citation, each restored by the next, so neither decides anything for the
      # other. The gate prints an advisory on a clean tree too, so a tier line alone proves
      # nothing: each control first cuts out the finding for its own citation, then reads the
      # tier off that line.
      - name: Prove the line-citation gate can fail on both tiers
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; cp -r . "$tmp/repo"; cd "$tmp/repo"
          python3 tools/check_line_citations.py > "$tmp/clean" \
            || { echo "::error::line-citation gate red unmutated"; exit 1; }
          cat "$tmp/clean"
          grep -qF 'conformance/run:46  by `spawn_count`' "$tmp/clean" \
            || { echo "::error::line-citation gate did not anchor conformance/run:46 unmutated"; exit 1; }
          # A line past the end of conformance/run: the cited line does not exist, so this blocks.
          sed -i 's|`conformance/run:46`|`conformance/run:99999`|' 07-open-findings.md
          st=0; python3 tools/check_line_citations.py > "$tmp/out" 2>&1 || st=$?
          cat "$tmp/out"
          [ "$st" != 0 ] || { echo "::error::line-citation gate passed a range that cannot exist"; exit 1; }
          grep -F 'cites conformance/run:99999, a line conformance/run does not have (' "$tmp/out" \
            > "$tmp/finding" \
            || { echo "::error::line-citation gate red, but not on the impossible range"; exit 1; }
          grep -qF 'BLOCKING LINE CITATION:' "$tmp/finding" \
            || { echo "::error::the impossible range was reported, but not in the blocking tier"; exit 1; }
          # A line that exists and that none of the sentence's literals is on: advisory, exit 0.
          sed -i 's|`conformance/run:99999`|`conformance/run:31`|' 07-open-findings.md
          python3 tools/check_line_citations.py > "$tmp/out" 2>&1 \
            || { echo "::error::line-citation gate blocked on an unanchored citation"; exit 1; }
          cat "$tmp/out"
          grep -F 'cites conformance/run:31, where no other literal from its sentence appears:' "$tmp/out" \
            > "$tmp/finding" \
            || { echo "::error::line-citation gate green, but silent about the unanchored citation"; exit 1; }
          grep -qF 'ADVISORY LINE CITATION:' "$tmp/finding" \
            || { echo "::error::the unanchored citation was reported, but not in the advisory tier"; exit 1; }

      - name: Prove the coverage gate can fail
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; cp -r . "$tmp/repo"; cd "$tmp/repo"
          python3 tools/check_coverage.py || { echo "::error::coverage gate red unmutated"; exit 1; }
          printf '\n**SEQ-11** rloop MUST do a thing no item proves.\n' >> 05-sequence.md
          st=0; python3 tools/check_coverage.py > "$tmp/out" 2>&1 || st=$?
          cat "$tmp/out"
          [ "$st" != 0 ] || { echo "::error::coverage gate passed an uncited requirement"; exit 1; }
          grep -qF 'UNCOVERED (no CNF item cites it and it is not excused): SEQ-11' "$tmp/out" \
            || { echo "::error::coverage gate red, but not on the uncited requirement"; exit 1; }

      - name: Prove the fixture gate can fail
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; cp -r . "$tmp/repo"; cd "$tmp/repo"
          python3 tools/check_fixtures.py || { echo "::error::fixture gate red unmutated"; exit 1; }
          printf 'x' >> conformance/fixtures/prompts/PRM-1.txt
          st=0; python3 tools/check_fixtures.py > "$tmp/out" 2>&1 || st=$?
          cat "$tmp/out"
          [ "$st" != 0 ] || { echo "::error::fixture gate passed a drifted fixture"; exit 1; }
          grep -qF 'prompts/PRM-1.txt: differs from the document' "$tmp/out" \
            || { echo "::error::fixture gate red, but not on the drifted fixture"; exit 1; }

      # The quoted line is the identifier diagnostic, not the `differs from the document` one a
      # changed block also earns: a gate that lost the identifier check must leave this step red.
      - name: Prove the fixture gate refuses a requirement identifier in a block
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; cp -r . "$tmp/repo"; cd "$tmp/repo"
          python3 tools/check_fixtures.py || { echo "::error::fixture gate red unmutated"; exit 1; }
          python3 - <<'PY'
          import re
          s = open("03-prompts.md").read()
          t = re.sub(r"(?m)^```prompt\n", "```prompt\nSee RUN-7 for the rule.\n", s, count=1)
          assert t != s, "no prompt block to mutate"
          open("03-prompts.md", "w").write(t)
          PY
          st=0; python3 tools/check_fixtures.py > "$tmp/out" 2>&1 || st=$?
          cat "$tmp/out"
          [ "$st" != 0 ] || { echo "::error::fixture gate passed an identifier in a prompt block"; exit 1; }
          grep -qF 'prompts/PRM-1.txt: holds the requirement identifier RUN-7' "$tmp/out" \
            || { echo "::error::fixture gate red, but not on the identifier in the prompt block"; exit 1; }
          sed -i '0,/^claude /s//claude CNF-22 /' 02-agents.md
          st=0; python3 tools/check_fixtures.py > "$tmp/argv" 2>&1 || st=$?
          cat "$tmp/argv"
          [ "$st" != 0 ] || { echo "::error::fixture gate passed an identifier in a command-line block"; exit 1; }
          grep -qF 'argv/AGT-3-1.txt: holds the requirement identifier CNF-22' "$tmp/argv" \
            || { echo "::error::fixture gate red, but not on the identifier in the command-line block"; exit 1; }

      # Two controls in one step: the mutations are in different files and answer to different
      # gates, so the regions mutation left in place decides nothing for the scenarios one.
      - name: Prove the regions and scenarios gates can fail
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; cp -r . "$tmp/repo"; cd "$tmp/repo"
          python3 tools/check_regions.py || { echo "::error::regions gate red unmutated"; exit 1; }
          sed -i 's/| judge | 0 | none | unchanged | no | \*\*exit 2\*\* |/| judge | 0 | none | unchanged | no | **next Round** |/' 01-run-lifecycle.md
          st=0; python3 tools/check_regions.py > "$tmp/regions" 2>&1 || st=$?
          cat "$tmp/regions"
          [ "$st" != 0 ] || { echo "::error::regions gate passed a drifted table"; exit 1; }
          grep -qF 'Rloop.Render.decisionTable drifted from its declaration' "$tmp/regions" \
            || { echo "::error::regions gate red, but not on the drifted table"; exit 1; }
          python3 tools/check_scenarios.py || { echo "::error::scenarios gate red unmutated"; exit 1; }
          sed -i '2s/\t0\t/\t2\t/; 2s/\t2\tpick/\t0\tpick/' conformance/scenarios.tsv
          st=0; python3 tools/check_scenarios.py > "$tmp/scenarios" 2>&1 || st=$?
          cat "$tmp/scenarios"
          [ "$st" != 0 ] || { echo "::error::scenarios gate passed a drifted file"; exit 1; }
          grep -qF 'FAIL: conformance/scenarios.tsv is not what the model enumerates; run with --write' \
            "$tmp/scenarios" \
            || { echo "::error::scenarios gate red, but not on the drifted file"; exit 1; }

      - name: Prove the panel-trace gate can fail
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; cp -r . "$tmp/repo"; cd "$tmp/repo"
          conformance/test-panel-trace || { echo "::error::panel-trace gate red unmutated"; exit 1; }
          sed -i 's/ || (\$1 == "reviewer" && \$i == "start")//' conformance/scenario-lib.sh
          st=0; conformance/test-panel-trace > "$tmp/out" 2>&1 || st=$?
          cat "$tmp/out"
          [ "$st" != 0 ] || { echo "::error::panel-trace gate passed an end-only comparator"; exit 1; }
          grep -qF 'FAIL: mixed success and timeout' "$tmp/out" \
            || { echo "::error::panel-trace gate red, but not on the end-only comparator"; exit 1; }

      # The fake's two fallthroughs past the end of a script (conformance/fakes/agent). Each
      # restores the older, non-failing behaviour, and each gets its own scratch copy: a mutation
      # left in place would decide the other control's verdict.
      - name: Prove the panel-trace gate can fail on the fake's probe fallthrough
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; cp -r . "$tmp/repo"; cd "$tmp/repo"
          conformance/test-panel-trace || { echo "::error::panel-trace gate red unmutated"; exit 1; }
          sed -i 's/|| shape=clear/|| shape="${shapes##*|}"/' conformance/fakes/agent
          st=0; conformance/test-panel-trace > "$tmp/out" 2>&1 || st=$?
          cat "$tmp/out"
          [ "$st" != 0 ] \
            || { echo "::error::panel-trace gate passed a repeated last probe shape"; exit 1; }
          grep -qF "FAIL: Round 2 of a fable-only probe script: not the bytes of clear" "$tmp/out" \
            || { echo "::error::panel-trace gate red, but not on the repeated probe shape"; exit 1; }

      - name: Prove the panel-trace gate can fail on the fake's Rounds fallthrough
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; cp -r . "$tmp/repo"; cd "$tmp/repo"
          conformance/test-panel-trace || { echo "::error::panel-trace gate red unmutated"; exit 1; }
          sed -i -e 's/o:-fail/o:-ok/' -e 's/p:-none/p:-all/' \
            -e 's/; judge="${judge:-fail}"//' conformance/fakes/agent
          st=0; conformance/test-panel-trace > "$tmp/out" 2>&1 || st=$?
          cat "$tmp/out"
          [ "$st" != 0 ] \
            || { echo "::error::panel-trace gate passed the old succeeding defaults"; exit 1; }
          grep -qF "FAIL: Round 2 Implementer: expected '1', got '0'" "$tmp/out" \
            || { echo "::error::panel-trace gate red, but not on the old succeeding defaults"; exit 1; }

      # restrict_path's groups (CNF-2), every mutation in conformance/scenario-lib.sh: one file,
      # so one scratch copy each, as above. The skipped-name control links a name the host lacks
      # anyway and the relative-entry control normalises only the names executable_path_needs
      # holds, each breaking its half of the function; the refusal controls shrink a name list a
      # refusal walks, which is what those groups pin -- a refusal that only ever covers cmp says
      # nothing about find. The relative-entry and per-name refusal arguments' owner is
      # conformance/test-panel-trace.
      - name: Prove the panel-trace gate can fail on a skipped name linked anyway
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; cp -r . "$tmp/repo"; cd "$tmp/repo"
          conformance/test-panel-trace || { echo "::error::panel-trace gate red unmutated"; exit 1; }
          sed -i 's|else skipped="$skipped $name"; fi|else skipped="$skipped $name"; ln -s "$work/nowhere-$name" "$private/$name"; fi|' conformance/scenario-lib.sh
          st=0; conformance/test-panel-trace > "$tmp/out" 2>&1 || st=$?
          cat "$tmp/out"
          [ "$st" != 0 ] \
            || { echo "::error::panel-trace gate passed a link for a skipped name"; exit 1; }
          grep -qF 'FAIL: a name the host lacks: factor was linked anyway' "$tmp/out" \
            || { echo "::error::panel-trace gate red, but not on the skipped name's link"; exit 1; }

      # Narrowed rather than deleted: the whole normalisation gone reddens the sed read this
      # group had before 6dc3326 as well, so that mutant re-proves the old read. This one leaves
      # every link relative but the names executable_path_needs holds, so restrict_path, whose
      # refusal walks that list alone, still returns 0 and only the cat read catches it. It
      # reddens on everything a deletion reddened on, so it replaces that control rather than
      # joining it -- a second step is another scratch copy and another gate run for no read. The
      # argument's owner is conformance/test-panel-trace.
      - name: Prove the panel-trace gate can fail on a normalisation narrowed to executable_path_needs
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; cp -r . "$tmp/repo"; cd "$tmp/repo"
          conformance/test-panel-trace || { echo "::error::panel-trace gate red unmutated"; exit 1; }
          sed -i 's|case "$file" in /\*) ;; \*) file="$PWD/$file" ;; esac # a relative PATH entry prints a relative path|case "$file" in /*) ;; *) case " $executable_path_needs " in *" $name "*) file="$PWD/$file" ;; esac ;; esac|' conformance/scenario-lib.sh
          st=0; conformance/test-panel-trace > "$tmp/out" 2>&1 || st=$?
          cat "$tmp/out"
          [ "$st" != 0 ] \
            || { echo "::error::panel-trace gate passed a link made from a relative path"; exit 1; }
          grep -qF 'FAIL: a relative PATH entry: cat links to a relative path' "$tmp/out" \
            || { echo "::error::panel-trace gate red, but not on the relative link"; exit 1; }

      - name: Prove the panel-trace gate can fail on a refusal that forgets find
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; cp -r . "$tmp/repo"; cd "$tmp/repo"
          conformance/test-panel-trace || { echo "::error::panel-trace gate red unmutated"; exit 1; }
          sed -i 's/for name in cmp find; do/for name in cmp; do/' conformance/scenario-lib.sh
          st=0; conformance/test-panel-trace > "$tmp/out" 2>&1 || st=$?
          cat "$tmp/out"
          [ "$st" != 0 ] \
            || { echo "::error::panel-trace gate passed a refusal that only covers cmp"; exit 1; }
          grep -qF "FAIL: find missing: exit status: expected '2', got '0'" "$tmp/out" \
            || { echo "::error::panel-trace gate red, but not on the refusal that forgets find"; exit 1; }

      - name: Prove the panel-trace gate can fail on a refusal that forgets cmp
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; cp -r . "$tmp/repo"; cd "$tmp/repo"
          conformance/test-panel-trace || { echo "::error::panel-trace gate red unmutated"; exit 1; }
          sed -i 's/for name in cmp find; do/for name in find; do/' conformance/scenario-lib.sh
          st=0; conformance/test-panel-trace > "$tmp/out" 2>&1 || st=$?
          cat "$tmp/out"
          [ "$st" != 0 ] \
            || { echo "::error::panel-trace gate passed a refusal that only covers find"; exit 1; }
          grep -qF "FAIL: cmp missing: exit status: expected '2', got '0'" "$tmp/out" \
            || { echo "::error::panel-trace gate red, but not on the refusal that forgets cmp"; exit 1; }

      - name: Prove the panel-trace gate can fail on a name dropped from executable_path_needs
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; cp -r . "$tmp/repo"; cd "$tmp/repo"
          conformance/test-panel-trace || { echo "::error::panel-trace gate red unmutated"; exit 1; }
          sed -i 's/ sed tr timeout/ sed timeout/' conformance/scenario-lib.sh
          st=0; conformance/test-panel-trace > "$tmp/out" 2>&1 || st=$?
          cat "$tmp/out"
          [ "$st" != 0 ] \
            || { echo "::error::panel-trace gate passed executable_path_needs without tr"; exit 1; }
          grep -qF "FAIL: a name the fakes need: exit status: expected '2', got '0'" "$tmp/out" \
            || { echo "::error::panel-trace gate red, but not on the dropped name"; exit 1; }

      - name: Prove the formal gate refuses sorry
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; cp -r . "$tmp/repo"; cd "$tmp/repo"
          nix develop --command bash tools/check_formal.sh \
            || { echo "::error::formal gate red unmutated"; exit 1; }
          sed -i 's/^theorem cap_off_overruns :$/theorem cap_off_overruns : True ∧/; s/implementers (run { Guards.all with cap := false } restless 1).2 = 2 := by decide/implementers (run { Guards.all with cap := false } restless 1).2 = 2 := ⟨trivial, sorry⟩/' tools/formal/Rloop/Properties.lean
          st=0; nix develop --command bash tools/check_formal.sh > "$tmp/out" 2>&1 || st=$?
          cat "$tmp/out"
          [ "$st" != 0 ] || { echo "::error::formal gate passed a sorry"; exit 1; }
          grep -qF 'FAIL  Rloop.cap_off_overruns (RUN-13) depends on [sorryAx]' "$tmp/out" \
            || { echo "::error::formal gate red, but not on the sorry's axiom dependency"; exit 1; }

      # The same gates again, inside the Nix build sandbox (flake.nix `checks.gates`), which has
      # no /usr/bin/env and nothing on PATH but the derivation's inputs. The steps above run the
      # gates on the Ubuntu runner, whatever shell each of them uses, and so cannot show that the
      # derivation builds; only this step can, and without it the derivation went red unnoticed.
      # It costs one more Lean build plus the gates, on the toolchain `nix develop` already
      # fetched. The sandbox-PATH argument's owner is AGENTS.md, *Gates*.
      - name: Run all gates in the Nix build sandbox
        run: nix flake check -L
